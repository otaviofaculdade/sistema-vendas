<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>
<div class="container mt-4">
    <h1>Pedido nº <span th:text="${pedido.id}"></span>
        <span class="badge fs-6 align-middle" th:classappend="${pedido.cancelado} ? 'bg-danger' : 'bg-success'"
              th:text="${pedido.status}"></span>
    </h1>

    <table class="table table-bordered">
        <tr>
            <th style="width: 200px">Data</th>
            <td th:text="${#temporals.format(pedido.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr>
            <th>Cliente</th>
            <td th:text="${pedido.cliente.nomeCompleto + ' - ' + pedido.cliente.cpfFormatado}"></td>
        </tr>
    </table>

    <h5>Itens</h5>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Produto</th>
            <th>Preço Unitário</th>
            <th>Quantidade</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${pedido.itens}">
            <td th:text="${item.produto.nome}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">Total</th>
            <th th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></th>
        </tr>
        </tfoot>
    </table>

    <form th:unless="${pedido.cancelado}" th:action="@{/pedidos/cancelar/{id}(id=${pedido.id})}" method="post"
          class="d-inline" onsubmit="return confirm('Cancelar este pedido? Os itens voltam para o estoque.');">
        <button type="submit" class="btn btn-danger">Cancelar Pedido</button>
    </form>
    <a th:href="@{/pedidos}" class="btn btn-secondary">Voltar</a>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
