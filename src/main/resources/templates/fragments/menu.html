<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Sistema de Vendas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/produtos}">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
            </ul>
            <span class="navbar-text me-3">
                <span sec:authentication="principal.nome"></span>
                <span class="badge bg-secondary" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge bg-secondary" sec:authorize="hasRole('PADRAO')">PADRÃO</span>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>
</body>
</html>
