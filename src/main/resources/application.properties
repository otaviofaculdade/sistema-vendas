spring.application.name=sistema-vendas

# Porta: o Render informa via variável PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco: variáveis de ambiente no Render; valores padrão = docker-compose.yml local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_vendas}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
